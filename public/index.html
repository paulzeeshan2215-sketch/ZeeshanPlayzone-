<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crazy 777 | 3D Slot Machine</title>

<style>
:root{
  --gold1:#fff6a5;
  --gold2:#ffd541;
  --gold3:#d78700;
  --gold4:#713000;
  --purple1:#7b116e;
  --purple2:#41003f;
  --purple3:#180020;
  --panel:#0d0712;
  --green1:#baff64;
  --green2:#20dc00;
  --green3:#006b00;
  --red:#ff3b37;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#08000d;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;
  color:white;

  background:
    radial-gradient(circle at 50% 35%,rgba(136,24,112,.75),transparent 28%),
    radial-gradient(circle at 15% 90%,rgba(255,184,0,.10),transparent 35%),
    radial-gradient(circle at 85% 20%,rgba(255,0,180,.12),transparent 30%),
    linear-gradient(145deg,#050009,#1b0022 45%,#050009);
}

/* =====================================================
   MAIN 3D SCENE
===================================================== */

.scene{
  width:min(1180px,96vw);
  perspective:1800px;
  padding:24px 0 45px;
}

.machine-shadow{
  width:82%;
  height:60px;
  margin:-20px auto 0;
  border-radius:50%;
  background:#000;
  filter:blur(35px);
  opacity:.85;
}

.machine{
  position:relative;
  width:100%;
  min-height:650px;

  transform-style:preserve-3d;
  transform:rotateX(2deg);

  border-radius:28px;

  padding:10px;

  background:
    linear-gradient(
      135deg,
      #592000 0%,
      #ffd857 9%,
      #fff3a2 18%,
      #c57500 34%,
      #ffe77a 52%,
      #8d3600 72%,
      #321000 100%
    );

  box-shadow:
    0 42px 70px rgba(0,0,0,.8),
    0 0 45px rgba(255,190,0,.25),
    inset 0 0 15px rgba(255,255,255,.75);
}

.machine::before{
  content:"";
  position:absolute;
  inset:5px;

  border-radius:24px;

  border:2px solid rgba(255,255,255,.5);

  pointer-events:none;

  box-shadow:
    inset 0 0 8px rgba(255,255,255,.4);
}

.machine-inner{
  position:relative;
  z-index:2;

  width:100%;
  min-height:630px;

  padding:18px;

  overflow:hidden;

  border-radius:21px;

  background:
    radial-gradient(circle at 50% 0%,rgba(151,27,159,.72),transparent 32%),
    linear-gradient(180deg,#67085f 0%,#3b003d 18%,#19001e 65%,#09000d 100%);

  box-shadow:
    inset 0 0 45px #000,
    inset 0 0 20px rgba(255,255,255,.08);
}

/* moving metallic reflection */

.machine-inner::after{
  content:"";

  position:absolute;
  inset:-20%;

  pointer-events:none;

  background:
    linear-gradient(
      110deg,
      transparent 42%,
      rgba(255,255,255,.06) 48%,
      rgba(255,255,255,.14) 50%,
      rgba(255,255,255,.05) 53%,
      transparent 58%
    );

  animation:metalSweep 8s linear infinite;
}

@keyframes metalSweep{
  from{
    transform:translateX(-55%);
  }
  to{
    transform:translateX(55%);
  }
}

/* =====================================================
   TOP SECTION
===================================================== */

.top-section{
  position:relative;
  z-index:5;

  height:125px;

  display:grid;

  grid-template-columns:
    1.25fr
    .85fr
    1fr;

  gap:18px;

  margin-bottom:14px;
}

/* PAYTABLE */

.paytable{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:7px;
}

.pay-card{
  min-height:55px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:8px 14px;

  border-radius:7px;

  background:
    linear-gradient(180deg,#2c0740,#110016);

  border:
    2px solid rgba(125,32,255,.45);

  box-shadow:
    inset 0 2px 8px rgba(255,255,255,.1),
    inset 0 -5px 10px rgba(0,0,0,.5),
    0 5px 9px rgba(0,0,0,.35);
}

.pay-symbol{
  color:#ffe55a;
  font-weight:900;
  font-size:18px;

  text-shadow:
    2px 2px 0 #a60000,
    0 0 8px #ffbd00;
}

.pay-symbol.bar{
  color:#5dd4ff;
  font-size:14px;

  text-shadow:
    0 0 7px #00aaff;
}

.pay-value{
  color:#ffd95d;
  font-weight:900;
  font-size:19px;
}

/* LOGO */

.logo-area{
  display:flex;
  align-items:center;
  justify-content:center;

  perspective:500px;
}

.logo{
  position:relative;

  text-align:center;

  transform:
    rotateX(7deg)
    rotateY(-2deg)
    skewX(-8deg);
}

.logo-crazy{
  display:block;

  color:#fff4a0;

  font-family:Georgia,serif;
  font-style:italic;
  font-weight:900;

  font-size:38px;

  letter-spacing:-2px;

  text-shadow:
    3px 3px 0 #b43200,
    6px 6px 0 #650e00,
    0 0 15px #ffcc00;
}

.logo-777{
  display:block;

  margin-top:-5px;

  color:#ffe347;

  font-family:Impact,Arial Black,sans-serif;
  font-size:62px;
  line-height:.75;

  letter-spacing:-6px;

  -webkit-text-stroke:2px #a82a00;

  text-shadow:
    3px 4px 0 #8a1300,
    7px 9px 0 #4b0500,
    0 0 20px #ffbd00;
}

.logo-2{
  position:absolute;

  right:-19px;
  bottom:-3px;

  color:#ff3c25;

  font-family:Impact,sans-serif;
  font-size:48px;

  text-shadow:
    3px 3px 0 #690000,
    0 0 9px #ffbc00;
}

/* MULTIPLIER */

.bonus-top{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;
}

.top-panel{
  overflow:hidden;

  border-radius:8px;

  background:
    linear-gradient(180deg,#310043,#110017);

  border:
    2px solid rgba(125,32,255,.45);

  box-shadow:
    inset 0 2px 9px rgba(255,255,255,.1),
    0 6px 9px rgba(0,0,0,.35);
}

.panel-head{
  height:31px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#ffe77c;

  font-size:13px;
  font-weight:900;
  letter-spacing:1px;

  background:
    linear-gradient(90deg,#6100ad,#220040);

  border-bottom:
    1px solid rgba(255,255,255,.12);
}

.multiplier-grid{
  padding:8px;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:7px;
}

.multiplier-ball{
  height:27px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  color:#fff6ae;
  font-weight:900;
  font-size:13px;

  background:
    radial-gradient(
      circle at 30% 25%,
      #fff6a5 0%,
      #d99100 42%,
      #7d2c00 70%,
      #300c00 100%
    );

  border:
    2px solid #ffe675;

  text-shadow:
    1px 1px 2px #000;

  box-shadow:
    0 3px 5px #000,
    inset 0 2px 3px rgba(255,255,255,.5);
}

.respin-box{
  min-height:72px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff6ad;

  font-family:Georgia,serif;
  font-weight:900;
  font-size:21px;

  text-shadow:
    2px 2px 0 #9b0000,
    0 0 9px #ffc400;
}

/* =====================================================
   REEL AREA
===================================================== */

.reel-section{
  position:relative;
  z-index:4;

  height:355px;

  display:grid;

  grid-template-columns:
    3.15fr
    1fr;

  gap:20px;
}

/* 3D METALLIC FRAME */

.main-reel-frame,
.bonus-frame{
  position:relative;

  padding:14px;

  border-radius:23px;

  background:
    linear-gradient(
      135deg,
      #3a1200 0%,
      #9d6c37 7%,
      #f8f5ed 18%,
      #8d8881 34%,
      #ffffff 48%,
      #817b74 68%,
      #f6f2e8 82%,
      #301300 100%
    );

  box-shadow:
    0 12px 0 #240800,
    0 22px 28px rgba(0,0,0,.62),
    inset 0 0 12px rgba(255,255,255,.85);

  transform:
    translateZ(35px);
}

.main-reel-frame::before,
.bonus-frame::before{
  content:"";

  position:absolute;
  inset:6px;

  border-radius:18px;

  border:
    2px solid rgba(66,21,0,.65);

  pointer-events:none;

  box-shadow:
    inset 0 0 8px rgba(0,0,0,.4);
}

.main-reels{
  position:relative;

  width:100%;
  height:100%;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:9px;

  overflow:hidden;

  border-radius:16px;
}

/* INDIVIDUAL REEL */

.reel{
  position:relative;

  overflow:hidden;

  border-radius:16px;

  background:
    linear-gradient(
      180deg,
      #1e1a20 0%,
      #6d676d 10%,
      #efefef 26%,
      #fff 50%,
      #eeeeee 73%,
      #655e66 91%,
      #171217 100%
    );

  border:
    2px solid #332b31;

  box-shadow:
    inset 10px 0 18px rgba(0,0,0,.28),
    inset -10px 0 18px rgba(0,0,0,.26),
    inset 0 25px 30px rgba(0,0,0,.46),
    inset 0 -25px 30px rgba(0,0,0,.48),
    0 5px 9px rgba(0,0,0,.5);
}

/* curved cylinder shine */

.reel::after{
  content:"";

  position:absolute;
  top:0;
  bottom:0;
  left:24%;
  width:52%;

  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,.5) 45%,
      rgba(255,255,255,.1) 75%,
      rgba(255,255,255,0) 100%
    );

  opacity:.35;

  z-index:5;
}

.reel::before{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  z-index:6;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.75) 0%,
      transparent 18%,
      transparent 78%,
      rgba(0,0,0,.75) 100%
    );
}

.symbol{
  position:absolute;

  left:0;
  top:50%;

  width:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  transform:
    translateY(-50%);

  font-size:clamp(64px,8vw,118px);

  filter:
    drop-shadow(0 9px 4px rgba(0,0,0,.35));

  z-index:3;
}

.symbol.bar-symbol{
  width:66%;
  height:27%;

  left:17%;
  top:50%;

  font-size:clamp(25px,4vw,48px);

  color:#48bfff;

  background:
    linear-gradient(180deg,#161616,#000);

  border:
    4px solid #999;

  border-radius:8px;

  box-shadow:
    0 5px 8px #000,
    inset 0 0 10px #000;

  text-shadow:
    0 0 8px #007dff;
}

/* =====================================================
   BONUS REEL
===================================================== */

.bonus-frame{
  padding:13px;
}

.bonus-label{
  position:absolute;

  top:-36px;
  left:0;
  width:100%;

  text-align:center;

  color:#8b5200;

  font-family:Georgia,serif;
  font-weight:900;
  font-size:23px;

  letter-spacing:1px;

  text-shadow:
    1px 1px 0 #fff;
}

.bonus-reel{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  border-radius:16px;

  background:
    linear-gradient(
      90deg,
      #5c2400 0%,
      #d5b26a 8%,
      #fff5d4 20%,
      #fff 50%,
      #fff3d1 80%,
      #5c2400 100%
    );

  border:
    5px solid #d98a00;

  box-shadow:
    inset 0 0 18px rgba(0,0,0,.48),
    0 0 16px rgba(255,180,0,.6);
}

.bonus-reel::before{
  content:"";

  position:absolute;
  inset:0;

  z-index:5;

  pointer-events:none;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.55),
      transparent 20%,
      transparent 80%,
      rgba(0,0,0,.55)
    );
}

.bonus-symbol{
  position:absolute;

  left:0;
  top:50%;

  width:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  transform:translateY(-50%);

  color:#c5ff38;

  font-weight:900;

  font-size:clamp(48px,7vw,100px);

  text-shadow:
    3px 3px 0 #005e2c,
    0 0 12px #c8ff46;

  z-index:3;
}

.bonus-symbol.respin{
  color:#ff3b30;

  font-size:clamp(30px,5vw,57px);

  text-shadow:
    2px 2px 0 #770000,
    0 0 10px #ffb000;
}

/* =====================================================
   GOLD PAYLINE
===================================================== */

.payline{
  position:absolute;

  z-index:20;

  left:-30px;
  right:-30px;
  top:50%;

  height:5px;

  transform:translateY(-50%);

  background:
    linear-gradient(
      90deg,
      #d67d00,
      #fff6a5 10%,
      #ffd028 50%,
      #fff6a5 90%,
      #d67d00
    );

  box-shadow:
    0 0 8px #ffb700;
}

.payline::before,
.payline::after{
  content:"";

  position:absolute;
  top:50%;

  width:0;
  height:0;

  transform:translateY(-50%);

  border-top:11px solid transparent;
  border-bottom:11px solid transparent;
}

.payline::before{
  left:0;
  border-left:18px solid #ffe25c;
}

.payline::after{
  right:0;
  border-right:18px solid #ffe25c;
}

/* =====================================================
   BOTTOM CONTROL PANEL
===================================================== */

.dashboard{
  position:relative;
  z-index:10;

  height:110px;

  margin-top:18px;

  display:grid;

  grid-template-columns:
    56px
    1.3fr
    .8fr
    1fr
    60px
    100px
    56px;

  gap:8px;

  align-items:center;
}

.control-circle{
  width:54px;
  height:54px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  color:#ddd;
  font-size:24px;

  background:
    radial-gradient(circle at 30% 25%,#777,#242424 58%,#080808);

  border:
    2px solid #999;

  box-shadow:
    0 5px 0 #050505,
    0 8px 10px rgba(0,0,0,.6);
}

.info-panel{
  min-height:68px;

  padding:10px 15px;

  display:flex;
  flex-direction:column;
  justify-content:center;

  border-radius:8px;

  background:
    linear-gradient(180deg,#1b1020,#08050b);

  border:
    1px solid rgba(255,255,255,.12);

  box-shadow:
    inset 0 0 13px #000,
    0 5px 9px rgba(0,0,0,.5);
}

.info-title{
  display:flex;
  align-items:center;
  gap:6px;

  color:#ffe064;

  font-size:17px;
  font-weight:900;
}

.level{
  padding:2px 7px;

  border-radius:3px;

  color:#fff;

  background:#a30b18;

  font-size:11px;
}

.info-value{
  margin-top:5px;

  color:#d9d8df;

  font-size:18px;
  font-weight:700;
}

.win-panel{
  align-items:center;
  text-align:center;
}

.win-panel .info-title{
  justify-content:center;
}

.auto-button{
  width:56px;
  height:56px;

  border-radius:50%;

  border:
    2px solid #c9952c;

  color:#fff0a1;
  font-size:28px;

  cursor:pointer;

  background:
    radial-gradient(circle,#725200,#261a00);

  box-shadow:
    0 5px 0 #120c00,
    0 8px 10px rgba(0,0,0,.6);
}

/* 3D SPIN BUTTON */

.spin-shell{
  width:98px;
  height:98px;

  padding:7px;

  margin-top:-23px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #d8ff8a 0%,
      #47e400 34%,
      #008700 63%,
      #003f00 100%
    );

  border:
    3px solid #123d00;

  box-shadow:
    0 0 0 3px #68d800,
    0 0 25px rgba(35,255,0,.65),
    0 10px 0 #003900,
    0 18px 20px rgba(0,0,0,.7),
    inset 0 4px 8px rgba(255,255,255,.6);
}

.spin-button{
  width:100%;
  height:100%;

  border:none;
  border-radius:50%;

  cursor:pointer;

  color:#fff;

  font-weight:900;
  font-size:15px;
  letter-spacing:.5px;

  background:
    radial-gradient(
      circle at 35% 22%,
      #d8ff8d,
      #4ef000 36%,
      #0db400 61%,
      #006400 82%,
      #003900
    );

  border:
    3px solid #bcff7d;

  box-shadow:
    inset 0 5px 8px rgba(255,255,255,.55),
    0 5px 0 #004400;

  transition:
    transform .12s,
    filter .12s;
}

.spin-button:hover{
  filter:brightness(1.12);
}

.spin-button:active{
  transform:
    translateY(5px)
    scale(.95);

  box-shadow:
    inset 0 5px 8px rgba(255,255,255,.55),
    0 1px 0 #004400;
}

.spin-button:disabled{
  filter:
    grayscale(1)
    brightness(.65);

  cursor:not-allowed;
}

.sound-button{
  cursor:pointer;
}

/* =====================================================
   REEL SPINNING
===================================================== */

.reel.spinning .symbol{
  animation:
    reelMotion .09s linear infinite;
}

.bonus-reel.spinning .bonus-symbol{
  animation:
    bonusMotion .09s linear infinite;
}

@keyframes reelMotion{
  0%{
    transform:
      translateY(-65%)
      scaleY(.72);
    filter:
      blur(2px)
      drop-shadow(0 9px 4px rgba(0,0,0,.3));
  }

  50%{
    transform:
      translateY(-35%)
      scaleY(1.22);
    filter:
      blur(4px);
  }

  100%{
    transform:
      translateY(-65%)
      scaleY(.72);
    filter:
      blur(2px);
  }
}

@keyframes bonusMotion{
  0%{
    transform:
      translateY(-70%)
      scaleY(.7);
    filter:blur(2px);
  }

  50%{
    transform:
      translateY(-30%)
      scaleY(1.2);
    filter:blur(3px);
  }

  100%{
    transform:
      translateY(-70%)
      scaleY(.7);
    filter:blur(2px);
  }
}

/* =====================================================
   WIN EFFECT
===================================================== */

.win-flash{
  animation:
    machineFlash .35s ease 5;
}

@keyframes machineFlash{
  50%{
    filter:brightness(1.28);
  }
}

.win-glow{
  box-shadow:
    0 0 0 4px #fff,
    0 0 28px #ffd700,
    0 0 60px #ff8a00;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:850px){

  body{
    align-items:flex-start;
    overflow:auto;
  }

  .scene{
    width:100%;
    padding:0;
  }

  .machine{
    border-radius:0;
    min-height:820px;
    transform:none;
  }

  .machine-inner{
    min-height:800px;
  }

  .top-section{
    height:auto;

    grid-template-columns:1fr;

    gap:10px;
  }

  .logo-area{
    height:85px;
  }

  .bonus-top{
    display:none;
  }

  .reel-section{
    height:390px;

    margin-top:18px;

    grid-template-columns:1fr;
  }

  .bonus-frame{
    display:none;
  }

  .dashboard{
    margin-top:28px;

    height:auto;

    grid-template-columns:
      1fr
      1fr
      1fr;

    gap:7px;
  }

  .control-circle{
    display:none;
  }

  .spin-shell{
    grid-column:2;
    grid-row:1 / span 2;

    justify-self:center;

    width:90px;
    height:90px;

    margin:0;
  }

  .info-panel{
    min-height:60px;
    padding:8px;
  }

  .info-title{
    font-size:13px;
  }

  .info-value{
    font-size:14px;
  }

  .auto-button{
    display:none;
  }
}

@media(max-width:500px){

  .machine-inner{
    padding:10px;
  }

  .pay-card{
    min-height:44px;
    padding:5px 8px;
  }

  .pay-symbol{
    font-size:12px;
  }

  .pay-symbol.bar{
    font-size:10px;
  }

  .pay-value{
    font-size:14px;
  }

  .logo-crazy{
    font-size:30px;
  }

  .logo-777{
    font-size:52px;
  }

  .logo-2{
    font-size:38px;
  }

  .reel-section{
    height:340px;
  }

  .main-reel-frame{
    padding:8px;
  }

  .symbol{
    font-size:55px;
  }

  .symbol.bar-symbol{
    font-size:20px;
  }

  .payline{
    left:-15px;
    right:-15px;
  }
}
</style>

</head>

  <main class="machine" id="machine">

  <section class="top-section">

<script>

/* =====================================================
   CRAZY 777
   VISUAL DEMO WITH VIRTUAL CREDITS
===================================================== */

let balance = 100000;
const bet = 960;

let spinning = false;
let musicStarted = false;
let soundEnabled = true;

const symbols = [
  "7️⃣",
  "BAR",
  "🔔",
  "🍒",
  "💎"
];

const bonusSymbols = [
  "2×",
  "3×",
  "5×",
  "10×",
  "RESPIN"
];

const bgMusic =
  document.getElementById("bgMusic");


/* =====================================================
   MUSIC
===================================================== */

function startMusic(){

  if(!soundEnabled) return;

  bgMusic.volume = 0.35;

  bgMusic.play()
    .then(() => {
      musicStarted = true;
    })
    .catch(() => {});

}

function toggleMusic(){

  soundEnabled = !soundEnabled;

  const soundButton =
    document.getElementById("soundButton");

  if(soundEnabled){

    soundButton.innerText = "🔊";

    startMusic();

  }else{

    soundButton.innerText = "🔇";

    bgMusic.pause();

  }

}

document
  .getElementById("soundButton")
  .addEventListener(
    "click",
    toggleMusic
  );


/* =====================================================
   SOUND EFFECTS
===================================================== */

let audioContext = null;

function effectSound(type){

  if(!soundEnabled) return;

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(audioContext.state === "suspended"){

      audioContext.resume();

    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    const now =
      audioContext.currentTime;


    if(type === "spin"){

      oscillator.type = "square";

      oscillator.frequency.setValueAtTime(
        160,
        now
      );

      oscillator.frequency.exponentialRampToValueAtTime(
        65,
        now + 0.08
      );

      gain.gain.setValueAtTime(
        0.045,
        now
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.08
      );

      oscillator.start(now);
      oscillator.stop(now + 0.08);

    }


    if(type === "stop"){

      oscillator.type = "sine";

      oscillator.frequency.setValueAtTime(
        240,
        now
      );

      gain.gain.setValueAtTime(
        0.08,
        now
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.14
      );

      oscillator.start(now);
      oscillator.stop(now + 0.14);

    }


    if(type === "win"){

      oscillator.type = "triangle";

      oscillator.frequency.setValueAtTime(
        450,
        now
      );

      oscillator.frequency.setValueAtTime(
        650,
        now + 0.15
      );

      oscillator.frequency.setValueAtTime(
        900,
        now + 0.3
      );

      gain.gain.setValueAtTime(
        0.12,
        now
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.75
      );

      oscillator.start(now);
      oscillator.stop(now + 0.75);

    }

  }catch(error){}

}


/* =====================================================
   HELPERS
===================================================== */

function randomItem(array){

  return array[
    Math.floor(
      Math.random() * array.length
    )
  ];

}


function formatNumber(number){

  return number.toLocaleString(
    "en-US",
    {
      minimumFractionDigits:3,
      maximumFractionDigits:3
    }
  );

}


function updateBalance(){

  document.getElementById(
    "balance"
  ).innerText =
    formatNumber(balance);

}


function setMainSymbol(
  reelNumber,
  value
){

  const element =
    document.getElementById(
      "symbol" + reelNumber
    );

  element.classList.remove(
    "bar-symbol"
  );

  element.innerText = value;

  if(value === "BAR"){

    element.classList.add(
      "bar-symbol"
    );

  }

}


function setBonusSymbol(value){

  const element =
    document.getElementById(
      "bonusSymbol"
    );

  element.classList.remove(
    "respin"
  );

  element.innerText = value;

  if(value === "RESPIN"){

    element.classList.add(
      "respin"
    );

  }

}


/* =====================================================
   SPIN
===================================================== */

function startSpin(){

  if(spinning) return;


  if(!musicStarted){

    startMusic();

  }


  if(balance < bet){

    return;

  }


  spinning = true;


  const spinButton =
    document.getElementById(
      "spinButton"
    );

  spinButton.disabled = true;


  balance -= bet;

  updateBalance();


  document.getElementById(
    "win"
  ).innerText =
    "0.000";


  const reel1 =
    document.getElementById("reel1");

  const reel2 =
    document.getElementById("reel2");

  const reel3 =
    document.getElementById("reel3");

  const bonusReel =
    document.getElementById("bonusReel");


  reel1.classList.add("spinning");
  reel2.classList.add("spinning");
  reel3.classList.add("spinning");

  bonusReel.classList.add("spinning");


  const visualInterval =
    setInterval(() => {

      setMainSymbol(
        1,
        randomItem(symbols)
      );

      setMainSymbol(
        2,
        randomItem(symbols)
      );

      setMainSymbol(
        3,
        randomItem(symbols)
      );

      setBonusSymbol(
        randomItem(bonusSymbols)
      );

      effectSound("spin");

    },90);


  /* STOP REELS */

  setTimeout(() => {

    reel1.classList.remove(
      "spinning"
    );

    effectSound("stop");

  },1000);


  setTimeout(() => {

    reel2.classList.remove(
      "spinning"
    );

    effectSound("stop");

  },1400);


  setTimeout(() => {

    reel3.classList.remove(
      "spinning"
    );

    effectSound("stop");

  },1800);


  setTimeout(() => {

    bonusReel.classList.remove(
      "spinning"
    );

    effectSound("stop");

  },2200);


  setTimeout(() => {

    clearInterval(
      visualInterval
    );


    const result1 =
      randomItem(symbols);

    const result2 =
      randomItem(symbols);

    const result3 =
      randomItem(symbols);

    const bonusResult =
      randomItem(bonusSymbols);


    setMainSymbol(
      1,
      result1
    );

    setMainSymbol(
      2,
      result2
    );

    setMainSymbol(
      3,
      result3
    );

    setBonusSymbol(
      bonusResult
    );


    evaluateWin(
      result1,
      result2,
      result3,
      bonusResult
    );


    spinButton.disabled = false;

    spinning = false;

  },2280);

}


/* =====================================================
   WIN LOGIC
===================================================== */

function evaluateWin(
  r1,
  r2,
  r3,
  bonus
){

  let multiplier = 0;


  if(
    r1 === r2 &&
    r2 === r3
  ){

    if(r1 === "7️⃣"){

      multiplier = 50;

    }else if(r1 === "BAR"){

      multiplier = 20;

    }else{

      multiplier = 12;

    }

  }

  else if(
    r1 === r2 ||
    r2 === r3 ||
    r1 === r3
  ){

    multiplier = 5;

  }


  if(multiplier === 0){

    return;

  }


  let bonusMultiplier = 1;


  if(bonus === "2×"){

    bonusMultiplier = 2;

  }

  if(bonus === "3×"){

    bonusMultiplier = 3;

  }

  if(bonus === "5×"){

    bonusMultiplier = 5;

  }

  if(bonus === "10×"){

    bonusMultiplier = 10;

  }

  if(bonus === "RESPIN"){

    bonusMultiplier = 2;

  }


  const totalWin =
    bet *
    multiplier *
    bonusMultiplier;


  balance += totalWin;


  updateBalance();


  document.getElementById(
    "win"
  ).innerText =
    formatNumber(totalWin);


  effectSound("win");


  const machine =
    document.getElementById("machine");

  machine.classList.add(
    "win-flash"
  );


  document.getElementById(
    "win"
  ).classList.add(
    "win-glow"
  );


  setTimeout(() => {

    machine.classList.remove(
      "win-flash"
    );

    document.getElementById(
      "win"
    ).classList.remove(
      "win-glow"
    );

  },1900);

}


/* =====================================================
   AUTO SPIN
===================================================== */

let autoSpinning = false;
let autoTimer = null;

document
  .getElementById("autoButton")
  .addEventListener(
    "click",
    () => {

      autoSpinning = !autoSpinning;

      const button =
        document.getElementById(
          "autoButton"
        );

      if(autoSpinning){

        button.innerText = "■";

        startSpin();

        autoTimer =
          setInterval(() => {

            if(!spinning){

              startSpin();

            }

          },3200);

      }else{

        button.innerText = "↻";

        clearInterval(autoTimer);

      }

    }
  );


document
  .getElementById("spinButton")
  .addEventListener(
    "click",
    startSpin
  );


/* FIRST USER INTERACTION CAN START MUSIC */

document.addEventListener(
  "pointerdown",
  () => {

    if(!musicStarted){

      startMusic();

    }

  },
  {
    once:true
  }
);

</script>
