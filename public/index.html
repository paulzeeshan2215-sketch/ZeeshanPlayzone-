<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Casino Arena</title>
    <style>
        :root {
            --gold: #ffd700;
            --dark-bg: #0f0c20;
            --card-bg: #1a1638;
            --accent: #ff2a5f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header & Wallet Section */
        header {
            background: linear-gradient(135deg, #110d29, #281545);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .wallet-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .wallet-box {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid var(--gold);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .audio-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            color: #fff;
            border-left: 4px solid var(--accent);
            padding-left: 10px;
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255, 42, 95, 0.3);
            border-color: var(--accent);
        }

        .game-info {
            padding: 15px;
        }

        .game-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .game-provider {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 12px;
        }

        .bet-info {
            font-size: 12px;
            color: var(--gold);
            margin-bottom: 12px;
        }

        .play-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(45deg, #ff2a5f, #ff7e40);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .play-btn:hover {
            opacity: 0.9;
        }

        /* Modal / Game Viewport */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            flex-direction: column;
        }

        .modal-header {
            background: #110d29;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .fallback-notice {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            color: #aaa;
        }

        .fallback-notice a {
            color: var(--gold);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Ambient Audio -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <header>
        <div class="brand">My Casino Hub</div>
        <div class="wallet-container">
            <button class="audio-btn" id="audio-toggle" onclick="toggleAudio()">🎵</button>
            <div class="wallet-box">
                🪙 कॉइन्स: <span id="user-coins">10,000</span>
            </div>
        </div>
    </header>

    <div class="container">
        <h2 class="section-title">प्रीमियम स्लॉट्स और कैसिनो गेम्स</h2>
        <div class="game-grid" id="game-grid">
            <!-- Dynamic Game Cards Inserted Here -->
        </div>
    </div>

    <!-- Game View Modal -->
    <div class="modal" id="game-modal">
        <div class="modal-header">
            <span id="modal-game-title" style="font-weight: bold; color: var(--gold);">गेम लोड हो रहा है...</span>
            <button class="close-btn" onclick="closeGame()">बंद करें ✖</button>
        </div>
        <div class="iframe-container">
            <iframe id="game-iframe" src=""></iframe>
            <div class="fallback-notice">
                यदि गेम लोड नहीं हो रहा है, तो <a id="direct-link" href="#" target="_blank">यहाँ क्लिक करके सीधे खेलें</a>।
            </div>
        </div>
    </div>

    <script>
        // आपके दिए गए गेम्स का डेटाबेस
        const games = [
            { title: "Book of Dead", provider: "Play'n GO", url: "https://sigma.world/play/games/playn-go/book-of-dead/", minBet: 10 },
            { title: "Legacy of Dead", provider: "Play'n GO", url: "https://sigma.world/play/games/playn-go/legacy-of-dead/", minBet: 10 },
            { title: "777 Streak Megacharged", provider: "Octoplay", url: "https://sigma.world/play/games/octoplay/777-streak-megacharged/", minBet: 20 },
            { title: "Money Coming", provider: "JILI Games", url: "https://www.casinorating.com/games/jili-games/slots/money-coming", minBet: 5 },
            { title: "Crazy 777", provider: "JILI Games", url: "https://www.casinorating.com/games/jili-games/slots/crazy-777", minBet: 5 },
            { title: "Golden Empire", provider: "JILI Games", url: "https://www.casinorating.com/games/jili-games/slots/golden-empire", minBet: 15 },
            { title: "Lucky Ball", provider: "JILI Games", url: "https://www.casinorating.com/games/jili-games/slots/lucky-ball", minBet: 10 },
            { title: "Chicken Dash", provider: "JILI Games", url: "https://www.casinorating.com/games/jili-games/slots/chicken-dash", minBet: 10 },
            { title: "Cuc Toc 777", provider: "JILI Games", url: "https://www.casinorating.com/games/jili-games/slots/cuc-toc-777", minBet: 5 },
            { title: "Aviator", provider: "Spribe", url: "https://www.bongobongo.ug/game/info/spribe-aviator", minBet: 50 }
        ];

        let coins = 10000;

        // गेम ग्रिड रेंडर करना
        function renderGames() {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-info">
                        <div class="game-title">${game.title}</div>
                        <div class="game-provider">${game.provider}</div>
                        <div class="bet-info">न्यूनतम बेट: ${game.minBet} कॉइन्स</div>
                    </div>
                    <div style="padding: 15px;">
                        <button class="play-btn" onclick="launchGame('${game.url}', '${game.title}', ${game.minBet})">अभी खेलें</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // गेम लॉन्च करना
        function launchGame(url, title, minBet) {
            if(coins < minBet) {
                alert("आपके पास पर्याप्त कॉइन्स नहीं हैं!");
                return;
            }

            // कॉइन्स काटना (Demo Simulation)
            coins -= minBet;
            document.getElementById('user-coins').innerText = coins.toLocaleString();

            document.getElementById('modal-game-title').innerText = title + " (बेट: " + minBet + " कॉइन्स)";
            document.getElementById('game-iframe').src = url;
            document.getElementById('direct-link').href = url;
            document.getElementById('game-modal').style.display = 'flex';
        }

        // मोडल बंद करना
        function closeGame() {
            document.getElementById('game-modal').style.display = 'none';
            document.getElementById('game-iframe').src = '';
        }

        // ऑडियो कंट्रोल
        const audio = document.getElementById('bg-music');
        let isPlaying = false;

        function toggleAudio() {
            if (isPlaying) {
                audio.pause();
                document.getElementById('audio-toggle').innerText = '🎵';
            } else {
                audio.play().catch(e => console.log("Audio play error"));
                document.getElementById('audio-toggle').innerText = '🔊';
            }
            isPlaying = !isPlaying;
        }

        // इनिशियलाइज़ेशन
        renderGames();
    </script>
</body>
</html>
