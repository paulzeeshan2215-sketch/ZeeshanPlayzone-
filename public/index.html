<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crazy 777 - 3D Slot Demo</title>

  <style>
    :root{
      --gold:#ffd24d;
      --gold2:#ff9d00;
      --purple:#4c005e;
      --purple2:#22002d;
      --panel:#160018;
      --green:#23e400;
      --red:#ff2d30;
      --blue:#1da5ff;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial, Helvetica, sans-serif;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background:
        radial-gradient(circle at center,#5e104d 0%,#250027 45%,#09000d 100%);
      color:white;
    }

    .game{
      width:min(1180px,100vw);
      aspect-ratio:16/9;
      min-height:500px;
      position:relative;
      overflow:hidden;

      background:
        linear-gradient(
          180deg,
          #7b0b6f 0%,
          #3e053f 18%,
          #22002c 70%,
          #0c0013 100%
        );

      border-radius:16px;

      box-shadow:
        0 0 70px rgba(255,40,190,.35),
        inset 0 0 80px rgba(0,0,0,.8);
    }

    /* =========================
       OUTER GOLD MACHINE FRAME
    ========================== */

    .game::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;

      border:
        10px solid transparent;

      border-image:
        linear-gradient(
          90deg,
          #7b3b00,
          #ffe68a,
          #a95000,
          #ffd15b,
          #5c2500
        ) 1;

      box-shadow:
        inset 0 0 30px #000;
      z-index:30;
    }

    /* =========================
       TOP AREA
    ========================== */

    .top{
      position:absolute;
      top:18px;
      left:22px;
      right:22px;
      height:125px;

      display:grid;
      grid-template-columns:
        1.15fr
        .72fr
        .85fr;

      gap:18px;

      z-index:10;
    }

    /* PAYTABLE */

    .paytable{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .pay-card{
      height:50px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 16px;

      background:
        linear-gradient(
          180deg,
          #2e0644,
          #100016
        );

      border-radius:7px;

      border:
        2px solid rgba(146,40,255,.55);

      box-shadow:
        inset 0 2px 7px rgba(255,255,255,.12),
        0 5px 8px rgba(0,0,0,.35);
    }

    .pay-symbol{
      font-size:20px;
      font-weight:900;
      color:#ffdd50;
      text-shadow:
        2px 2px 0 #a90000,
        0 0 8px #ffb700;
    }

    .pay-symbol.bar{
      color:#24d67a;
      font-size:15px;
      text-shadow:
        0 0 7px #00ff77;
    }

    .pay-value{
      font-size:21px;
      font-weight:900;
      color:#ffd966;
      letter-spacing:1px;
    }

    /* LOGO */

    .logo-box{
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .logo{
      text-align:center;
      line-height:.72;
      transform:skew(-7deg);
    }

    .logo .crazy{
      display:block;

      font-size:32px;
      font-style:italic;
      font-weight:900;

      color:#fff68b;

      text-shadow:
        3px 3px 0 #b43800,
        0 0 14px #ffd400;
    }

    .logo .seven{
      font-size:45px;
      font-weight:1000;

      color:#ffe55b;

      text-shadow:
        3px 3px 0 #c70000,
        6px 6px 0 #7c0010,
        0 0 15px #ffdd00;
    }

    .logo .two{
      color:#ff3b24;
      font-size:54px;
      margin-left:-5px;
      text-shadow:
        3px 3px 0 #6e0000,
        0 0 10px #ffbd00;
    }

    /* MULTIPLIER PANEL */

    .bonus-top{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .small-panel{
      min-height:104px;

      background:
        linear-gradient(
          180deg,
          #30003d,
          #110017
        );

      border:
        2px solid rgba(139,36,255,.55);

      border-radius:8px;

      overflow:hidden;

      box-shadow:
        inset 0 2px 10px rgba(255,255,255,.08),
        0 6px 10px rgba(0,0,0,.35);
    }

    .panel-title{
      height:31px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:
        linear-gradient(
          90deg,
          #4d00a4,
          #19003b
        );

      color:#ffe888;

      font-size:15px;
      font-weight:900;

      letter-spacing:1px;

      border-bottom:
        1px solid rgba(255,255,255,.1);
    }

    .multiplier-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;

      padding:8px;
    }

    .multiplier{
      height:26px;

      border-radius:50%;

      display:flex;
      align-items:center;
      justify-content:center;

      font-weight:900;
      font-size:14px;

      color:#fff4a0;

      background:
        radial-gradient(
          circle at 30% 25%,
          #fff18b,
          #d58d00 50%,
          #6a2300
        );

      border:
        2px solid #ffd75a;

      text-shadow:
        1px 1px 2px #000;

      box-shadow:
        0 3px 5px #000;
    }

    .respin{
      height:73px;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#fff5a3;

      font-family:Georgia,serif;
      font-size:24px;
      font-weight:900;

      text-shadow:
        2px 2px 0 #9d0000,
        0 0 10px #ffcc00;
    }

    /* =========================
       MAIN REELS AREA
    ========================== */

    .machine{
      position:absolute;

      top:154px;
      left:36px;
      right:36px;

      bottom:90px;

      display:grid;

      grid-template-columns:
        3.1fr
        1.25fr;

      gap:20px;

      z-index:5;
    }

    .main-reel-frame,
    .bonus-frame{
      position:relative;

      border-radius:25px;

      padding:14px;

      background:
        linear-gradient(
          145deg,
          #210018,
          #d7d2cf 15%,
          #ffffff 28%,
          #8e817e 50%,
          #fff 78%,
          #3c1820
        );

      box-shadow:
        0 12px 18px rgba(0,0,0,.65),
        inset 0 0 16px rgba(255,255,255,.8);
    }

    .main-reel-frame::before,
    .bonus-frame::before{
      content:"";

      position:absolute;
      inset:7px;

      border-radius:19px;

      border:
        2px solid rgba(54,12,0,.6);

      pointer-events:none;
    }

    .main-reels{
      width:100%;
      height:100%;

      display:grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:8px;

      overflow:hidden;

      border-radius:18px;
    }

    .reel{
      position:relative;

      overflow:hidden;

      border-radius:18px;

      background:
        linear-gradient(
          180deg,
          #252027 0%,
          #e8e8e8 18%,
          #fff 45%,
          #f8f8f8 58%,
          #777078 100%
        );

      box-shadow:
        inset 8px 0 15px rgba(0,0,0,.28),
        inset -8px 0 15px rgba(0,0,0,.25),
        inset 0 18px 24px rgba(0,0,0,.35),
        inset 0 -18px 24px rgba(0,0,0,.4);
    }

    .reel::before,
    .reel::after{
      content:"";

      position:absolute;
      left:0;
      right:0;

      height:34%;

      z-index:3;

      pointer-events:none;
    }

    .reel::before{
      top:0;

      background:
        linear-gradient(
          #2a242b,
          transparent
        );
    }

    .reel::after{
      bottom:0;

      background:
        linear-gradient(
          transparent,
          #393039
        );
    }

    .symbol{
      position:absolute;

      inset:0;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:clamp(55px,7vw,115px);

      z-index:2;

      filter:
        drop-shadow(
          0 8px 4px rgba(0,0,0,.35)
        );

      transition:.15s;
    }

    .symbol.bar-symbol{
      font-size:clamp(30px,4vw,58px);

      color:#3bb8ff;

      background:#030303;

      width:65%;
      height:24%;

      left:17.5%;
      top:38%;

      border-radius:7px;

      border:
        3px solid #aaa;

      box-shadow:
        0 4px 6px #000,
        inset 0 0 10px #000;

      font-weight:900;

      text-shadow:
        0 0 7px #1686ff;
    }

    /* BONUS REEL */

    .bonus-frame{
      padding:14px;
    }

    .bonus-title{
      position:absolute;

      top:-38px;
      left:0;
      right:0;

      text-align:center;

      color:#7d4b00;

      font-family:Georgia,serif;

      font-size:25px;
      font-weight:900;

      letter-spacing:2px;

      text-shadow:
        1px 1px 0 #fff;
    }

    .bonus-reel{
      position:relative;

      width:100%;
      height:100%;

      overflow:hidden;

      border-radius:20px;

      background:
        linear-gradient(
          90deg,
          #4a1a00,
          #fff2c7 12%,
          #fff 50%,
          #fff0c7 88%,
          #4a1a00
        );

      border:
        5px solid #d88600;

      box-shadow:
        inset 0 0 18px rgba(0,0,0,.45),
        0 0 14px rgba(255,170,0,.65);
    }

    .bonus-symbol{
      position:absolute;

      inset:0;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:clamp(50px,7vw,100px);

      font-weight:900;

      color:#b5ff29;

      text-shadow:
        3px 3px 0 #006039,
        0 0 12px #cfff42;

      z-index:2;
    }

    .bonus-symbol.badge{
      color:#baff36;
      font-size:clamp(42px,6vw,85px);
    }

    .bonus-symbol.badge::before{
      content:"";

      position:absolute;

      width:58%;
      aspect-ratio:1;

      border-radius:50%;

      border:
        7px solid #2051a0;

      box-shadow:
        0 0 0 8px #f5e24d,
        inset 0 0 20px rgba(0,0,0,.35);

      z-index:-1;
    }

    /* PAYLINE */

    .payline{
      position:absolute;

      left:-25px;
      right:-25px;

      top:50%;

      height:5px;

      transform:translateY(-50%);

      background:
        linear-gradient(
          90deg,
          #e69100,
          #fff6a3 15%,
          #ffcb25 50%,
          #fff6a3 85%,
          #e69100
        );

      z-index:20;

      box-shadow:
        0 0 9px #ffb700;
    }

    .payline::before,
    .payline::after{
      content:"";

      position:absolute;

      top:50%;

      transform:translateY(-50%);

      width:0;
      height:0;

      border-top:12px solid transparent;
      border-bottom:12px solid transparent;
    }

    .payline::before{
      left:0;

      border-left:
        18px solid #ffd83b;
    }

    .payline::after{
      right:0;

      border-right:
        18px solid #ffd83b;
    }

    /* =========================
       BOTTOM DASHBOARD
    ========================== */

    .dashboard{
      position:absolute;

      left:20px;
      right:20px;
      bottom:8px;

      height:76px;

      display:grid;

      grid-template-columns:
        55px
        1.35fr
        .9fr
        1fr
        65px
        95px
        55px;

      gap:8px;

      align-items:center;

      z-index:40;
    }

    .bottom-panel{
      height:64px;

      display:flex;
      flex-direction:column;

      justify-content:center;

      padding:0 15px;

      background:
        linear-gradient(
          180deg,
          #1e1022,
          #08000c
        );

      border-radius:9px;

      border:
        1px solid rgba(255,255,255,.13);

      box-shadow:
        inset 0 0 10px #000,
        0 5px 8px rgba(0,0,0,.45);
    }

    .small-bottom{
      height:54px;
      border-radius:50%;

      display:flex;
      align-items:center;
      justify-content:center;

      background:
        radial-gradient(
          circle,
          #555,
          #111
        );

      border:
        2px solid #888;

      font-size:25px;

      box-shadow:
        0 5px 7px #000;
    }

    .dash-label{
      color:#ffe15e;

      font-size:18px;

      font-weight:900;

      display:flex;
      align-items:center;
      gap:7px;
    }

    .dash-label small{
      background:#9e0b18;

      color:#fff;

      padding:2px 7px;

      border-radius:3px;

      font-size:12px;
    }

    .dash-value{
      margin-top:5px;

      font-size:19px;

      color:#d8d8e5;

      font-weight:700;
    }

    .win-panel{
      align-items:center;
      text-align:center;
    }

    .win-panel .dash-label{
      justify-content:center;
    }

    .auto-btn{
      height:54px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:50%;

      font-size:30px;

      background:
        radial-gradient(
          circle,
          #614600,
          #241800
        );

      border:
        2px solid #c39127;

      cursor:pointer;

      box-shadow:
        0 5px 8px #000;
    }

    .spin-wrap{
      width:94px;
      height:94px;

      margin-top:-28px;

      border-radius:50%;

      padding:7px;

      background:
        radial-gradient(
          circle,
          #b8ff59,
          #00a600 55%,
          #004400 75%
        );

      box-shadow:
        0 0 0 4px #0d3e00,
        0 0 25px #00ff21,
        0 10px 15px #000;
    }

    .spin-btn{
      width:100%;
      height:100%;

      border:none;

      border-radius:50%;

      cursor:pointer;

      font-size:14px;
      font-weight:900;

      color:#fff;

      background:
        radial-gradient(
          circle at 35% 25%,
          #c9ff71,
          #29e000 42%,
          #008b00 75%,
          #004c00
        );

      border:
        4px solid #a8ff63;

      box-shadow:
        inset 0 6px 9px rgba(255,255,255,.45),
        0 5px 0 #004000;

      transition:.12s;
    }

    .spin-btn:hover{
      filter:brightness(1.15);
    }

    .spin-btn:active{
      transform:translateY(4px) scale(.95);
      box-shadow:
        inset 0 6px 9px rgba(255,255,255,.45),
        0 1px 0 #004000;
    }

    .spin-btn:disabled{
      filter:grayscale(1) brightness(.65);
      cursor:not-allowed;
    }

    .wifi{
      color:#7dff9a;
      font-size:30px;
      text-align:center;
      text-shadow:0 0 8px #00ff66;
    }

    /* =========================
       SPIN ANIMATION
    ========================== */

    .reel.spinning .symbol,
    .bonus-reel.spinning .bonus-symbol{
      animation:spinMotion .11s linear infinite;
    }

    @keyframes spinMotion{
      0%{
        transform:
          translateY(-40px)
          scaleY(.75);
        filter:blur(2px);
      }

      50%{
        transform:
          translateY(40px)
          scaleY(1.2);
        filter:blur(3px);
      }

      100%{
        transform:
          translateY(-40px)
          scaleY(.75);
        filter:blur(2px);
      }
    }

    .machine-win{
      animation:winFlash .35s ease 5;
    }

    @keyframes winFlash{
      50%{
        filter:brightness(1.35);
      }
    }

    /* =========================
       MOBILE
    ========================== */

    @media(max-width:850px){

      body{
        align-items:flex-start;
        overflow:auto;
        background:#0c0012;
      }

      .game{
        width:100%;
        min-height:720px;
        aspect-ratio:auto;
        border-radius:0;
      }

      .top{
        height:auto;
        grid-template-columns:1fr;
      }

      .logo-box{
        height:80px;
      }

      .bonus-top{
        display:none;
      }

      .machine{
        top:250px;

        grid-template-columns:1fr;

        bottom:160px;
      }

      .bonus-frame{
        display:none;
      }

      .dashboard{
        height:auto;
        bottom:15px;

        grid-template-columns:
          1fr
          1fr
          1fr;

        gap:8px;
      }

      .small-bottom{
        display:none;
      }

      .spin-wrap{
        width:85px;
        height:85px;

        grid-column:2;
        grid-row:1 / span 2;

        justify-self:center;
        align-self:center;
      }

      .bottom-panel{
        height:58px;
        padding:0 9px;
      }

      .dash-label{
        font-size:13px;
      }

      .dash-value{
        font-size:14px;
      }

      .pay-symbol{
        font-size:14px;
      }

      .pay-value{
        font-size:15px;
      }
    }

    @media(max-width:520px){

      .paytable{
        gap:5px;
      }

      .pay-card{
        height:42px;
        padding:0 7px;
      }

      .main-reel-frame{
        padding:8px;
      }

      .reel{
        border-radius:10px;
      }

      .symbol{
        font-size:55px;
      }

      .symbol.bar-symbol{
        font-size:23px;
      }

      .game{
        min-height:650px;
      }

      .machine{
        top:225px;
      }
    }
  </style>
</head>

<body>

  <div class="game" id="game">

    <!-- ================= TOP ================= -->

    <div class="top">

      <!-- PAYTABLE -->

      <div class="paytable">

        <div class="pay-card">
          <div class="pay-symbol">7️⃣ 7️⃣ 7️⃣</div>
          <div class="pay-value">32000</div>
        </div>

        <div class="pay-card">
          <div class="pay-symbol">7️⃣ 7️⃣</div>
          <div class="pay-value">6400</div>
        </div>

        <div class="pay-card">
          <div class="pay-symbol">7️⃣ 7️⃣ 7️⃣</div>
          <div class="pay-value">3200</div>
        </div>

        <div class="pay-card">
          <div class="pay-symbol bar">BAR BAR BAR</div>
          <div class="pay-value">1280</div>
        </div>

        <div class="pay-card">
          <div class="pay-symbol">7️⃣ 7️⃣</div>
          <div class="pay-value">1280</div>
        </div>

        <div class="pay-card">
          <div class="pay-symbol bar">BAR BAR BAR</div>
          <div class="pay-value">640</div>
        </div>

      </div>

      <!-- LOGO -->

      <div class="logo-box">

        <div class="logo">
          <span class="crazy">Crazy</span>
          <span class="seven">777</span>
          <span class="two">2</span>
        </div>

      </div>

      <!-- MULTIPLIER / RESPIN -->

      <div class="bonus-top">

        <div class="small-panel">

          <div class="panel-title">
            MULTIPLIER
          </div>

          <div class="multiplier-grid">
            <div class="multiplier">10×</div>
            <div class="multiplier">5×</div>
            <div class="multiplier">3×</div>
            <div class="multiplier">2×</div>
          </div>

        </div>

        <div class="small-panel">

          <div class="panel-title">
            RESPIN
          </div>

          <div class="respin">
            RESPIN
          </div>

        </div>

      </div>

    </div>

    <!-- ================= MACHINE ================= -->

    <div class="machine">

      <!-- MAIN 3 REELS -->

      <div class="main-reel-frame">

        <div class="main-reels">

          <div class="reel" id="reel1">
            <div class="symbol" id="symbol1">7️⃣</div>
          </div>

          <div class="reel" id="reel2">
            <div class="symbol" id="symbol2">7️⃣</div>
          </div>

          <div class="reel" id="reel3">
            <div class="symbol" id="symbol3">7️⃣</div>
          </div>

        </div>

      </div>

      <!-- BONUS REEL -->

      <div class="bonus-frame">

        <div class="bonus-title">
          BONUS REEL
        </div>

        <div class="bonus-reel" id="bonusReel">

          <div
            class="bonus-symbol badge"
            id="bonusSymbol"
          >
            2×
          </div>

        </div>

      </div>

      <!-- PAYLINE -->

      <div class="payline"></div>

    </div>

    <!-- ================= DASHBOARD ================= -->

    <div class="dashboard">

      <div class="small-bottom">⚙️</div>

      <div class="bottom-panel">

        <div class="dash-label">
          <small>LV 5</small>
          Balance
        </div>

        <div
          class="dash-value"
          id="balance"
        >
          100,000.000
        </div>

      </div>

      <div class="bottom-panel">

        <div class="dash-label">
          🪙 Bet
        </div>

        <div
          class="dash-value"
          id="bet"
        >
          960
        </div>

      </div>

      <div class="bottom-panel win-panel">

        <div class="dash-label">
          WIN
        </div>

        <div
          class="dash-value"
          id="win"
        >
          0.000
        </div>

      </div>

      <div
        class="auto-btn"
        title="Auto Spin"
      >
        ↻
      </div>

      <div class="spin-wrap">

        <button
          class="spin-btn"
          id="spinButton"
        >
          SPIN
        </button>

      </div>

      <div class="wifi">◔</div>

    </div>

  </div>


  <script>

    /* =========================================
       CRAZY 777 - DEMO SLOT ENGINE
       Virtual credits only
    ========================================= */

    let balance = 100000;
    const bet = 960;

    let spinning = false;

    const symbols = [
      "7️⃣",
      "BAR",
      "🔔",
      "🍒",
      "💎"
    ];

    const bonusSymbols = [
      "2×",
      "3×",
      "5×",
      "10×",
      "RESPIN"
    ];


    /* AUDIO */

    let audioContext = null;


    function sound(type){

      try{

        if(!audioContext){

          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();

        }

        if(audioContext.state === "suspended"){
          audioContext.resume();
        }

        const oscillator =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        const now =
          audioContext.currentTime;


        if(type === "spin"){

          oscillator.type = "square";

          oscillator.frequency.setValueAtTime(
            160,
            now
          );

          oscillator.frequency.exponentialRampToValueAtTime(
            80,
            now + 0.07
          );

          gain.gain.setValueAtTime(
            0.05,
            now
          );

          gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + 0.08
          );

          oscillator.start(now);
          oscillator.stop(now + 0.08);

        }


        if(type === "stop"){

          oscillator.type = "sine";

          oscillator.frequency.setValueAtTime(
            250,
            now
          );

          gain.gain.setValueAtTime(
            0.08,
            now
          );

          gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + 0.15
          );

          oscillator.start(now);
          oscillator.stop(now + 0.15);

        }


        if(type === "win"){

          oscillator.type = "triangle";

          oscillator.frequency.setValueAtTime(
            450,
            now
          );

          oscillator.frequency.setValueAtTime(
            650,
            now + 0.12
          );

          oscillator.frequency.setValueAtTime(
            900,
            now + 0.25
          );

          gain.gain.setValueAtTime(
            0.12,
            now
          );

          gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + 0.7
          );

          oscillator.start(now);
          oscillator.stop(now + 0.7);

        }

      }catch(error){}

    }


    function randomItem(array){

      return array[
        Math.floor(
          Math.random() * array.length
        )
      ];

    }


    function formatNumber(number){

      return number.toLocaleString(
        "en-US",
        {
          minimumFractionDigits:3,
          maximumFractionDigits:3
        }
      );

    }


    function updateBalance(){

      document.getElementById(
        "balance"
      ).innerText =
        formatNumber(balance);

    }


    function setMainSymbol(
      number,
      value
    ){

      const element =
        document.getElementById(
          "symbol" + number
        );

      element.classList.remove(
        "bar-symbol"
      );

      element.innerText = value;


      if(value === "BAR"){

        element.classList.add(
          "bar-symbol"
        );

      }

    }


    function startSpin(){

      if(spinning) return;


      if(balance < bet){

        alert(
          "Insufficient demo balance!"
        );

        return;

      }


      spinning = true;


      const button =
        document.getElementById(
          "spinButton"
        );

      button.disabled = true;


      balance -= bet;

      updateBalance();


      document.getElementById(
        "win"
      ).innerText =
        "0.000";


      const reels = [
        document.getElementById("reel1"),
        document.getElementById("reel2"),
        document.getElementById("reel3")
      ];

      const bonusReel =
        document.getElementById(
          "bonusReel"
        );


      reels.forEach(
        reel => reel.classList.add("spinning")
      );

      bonusReel.classList.add(
        "spinning"
      );


      const animationInterval =
        setInterval(() => {

          setMainSymbol(
            1,
            randomItem(symbols)
          );

          setMainSymbol(
            2,
            randomItem(symbols)
          );

          setMainSymbol(
            3,
            randomItem(symbols)
          );

          document.getElementById(
            "bonusSymbol"
          ).innerText =
            randomItem(bonusSymbols);

          sound("spin");

        }, 95);


      /* STOP REELS ONE BY ONE */

      setTimeout(() => {

        reels[0].classList.remove(
          "spinning"
        );

        sound("stop");

      }, 1000);


      setTimeout(() => {

        reels[1].classList.remove(
          "spinning"
        );

        sound("stop");

      }, 1400);


      setTimeout(() => {

        reels[2].classList.remove(
          "spinning"
        );

        sound("stop");

      }, 1800);


      setTimeout(() => {

        bonusReel.classList.remove(
          "spinning"
        );

        sound("stop");

      }, 2200);


      setTimeout(() => {

        clearInterval(
          animationInterval
        );


        const r1 =
          randomItem(symbols);

        const r2 =
          randomItem(symbols);

        const r3 =
          randomItem(symbols);

        const bonus =
          randomItem(bonusSymbols);


        setMainSymbol(1,r1);
        setMainSymbol(2,r2);
        setMainSymbol(3,r3);


        document.getElementById(
          "bonusSymbol"
        ).innerText =
          bonus;


        evaluateWin(
          r1,
          r2,
          r3,
          bonus
        );


        button.disabled = false;

        spinning = false;

      }, 2300);

    }


    function evaluateWin(
      r1,
      r2,
      r3,
      bonus
    ){

      let multiplier = 0;


      /* THREE MATCH */

      if(
        r1 === r2 &&
        r2 === r3
      ){

        if(r1 === "7️⃣"){
          multiplier = 50;
        }

        else if(r1 === "BAR"){
          multiplier = 20;
        }

        else{
          multiplier = 12;
        }

      }


      /* TWO MATCH */

      else if(
        r1 === r2 ||
        r2 === r3 ||
        r1 === r3
      ){

        multiplier = 5;

      }


      if(multiplier === 0){

        return;

      }


      let bonusMultiplier = 1;


      if(bonus === "2×"){
        bonusMultiplier = 2;
      }

      if(bonus === "3×"){
        bonusMultiplier = 3;
      }

      if(bonus === "5×"){
        bonusMultiplier = 5;
      }

      if(bonus === "10×"){
        bonusMultiplier = 10;
      }

      if(bonus === "RESPIN"){
        bonusMultiplier = 2;
      }


      const totalWin =
        bet *
        multiplier *
        bonusMultiplier;


      balance += totalWin;


      updateBalance();


      document.getElementById(
        "win"
      ).innerText =
        formatNumber(totalWin);


      sound("win");


      document.getElementById(
        "game"
      ).classList.add(
        "machine-win"
      );


      setTimeout(() => {

        document.getElementById(
          "game"
        ).classList.remove(
          "machine-win"
        );

      }, 1800);

    }


    document.getElementById(
      "spinButton"
    ).addEventListener(
      "click",
      startSpin
    );

  </script>

</body>
</html>
