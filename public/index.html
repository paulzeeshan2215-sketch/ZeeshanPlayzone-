<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crazy 777 - Premium Slot Engine</title>
    <style>
        :root {
            --gold-light: #fff3a1;
            --gold-mid: #ffd700;
            --gold-dark: #b8860b;
            --bg-dark: #0a051b;
            --purple-panel: #1b0a38;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', Impact, sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #2c0952 0%, var(--bg-dark) 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .casino-wrapper {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(180deg, #421068 0%, #170529 100%);
            border: 6px solid var(--gold-mid);
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.4), inset 0 0 20px rgba(0,0,0,0.8);
            padding: 20px;
            position: relative;
        }

        /* HEADER & PAYTABLE */
        .top-paytable {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--gold-dark);
            border-radius: 10px;
            padding: 10px 20px;
            margin-bottom: 15px;
            font-size: 14px;
            color: var(--gold-light);
        }

        .pay-item {
            text-align: center;
        }

        .pay-item span {
            color: #ff2a5f;
            font-weight: bold;
        }

        /* MAIN MACHINE DISPLAY */
        .machine-frame {
            background: linear-gradient(145deg, #120224, #260742);
            border: 4px solid var(--gold-mid);
            border-radius: 15px;
            padding: 20px;
            position: relative;
            box-shadow: inset 0 0 30px #000;
        }

        .reels-window {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1.2fr;
            gap: 12px;
            background: #000;
            padding: 15px;
            border-radius: 10px;
            border: 3px solid #ffaa00;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .reel-box {
            height: 140px;
            background: linear-gradient(180deg, #111 0%, #ffffff 50%, #111 100%);
            border: 2px solid #444;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }

        .bonus-reel {
            background: linear-gradient(180deg, #3d0000 0%, #ffd700 50%, #3d0000 100%);
            border: 3px solid var(--gold-light);
        }

        /* WIN WIN DISPLAY */
        .status-bar {
            text-align: center;
            margin: 15px 0;
            font-size: 26px;
            color: var(--gold-mid);
            text-shadow: 0 0 10px var(--gold-mid);
            min-height: 35px;
        }

        /* DASHBOARD CONTROLS */
        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 12px;
            border: 2px solid var(--gold-dark);
        }

        .info-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 20px;
            color: var(--gold-light);
        }

        .spin-btn-container {
            position: relative;
        }

        .spin-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #00ff66 0%, #008a3b 100%);
            border: 4px solid #fff;
            color: #fff;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.8);
            transition: transform 0.1s;
        }

        .spin-btn:active {
            transform: scale(0.92);
        }

        .spin-btn:disabled {
            filter: grayscale(1);
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="casino-wrapper">
        <!-- TOP PAYTABLE BANNER -->
        <div class="top-paytable">
            <div class="pay-item">7️⃣7️⃣7️⃣ <span>320,000</span></div>
            <div class="pay-item">7️⃣7️⃣ <span>64,000</span></div>
            <div class="pay-item">7️⃣ <span>32,000</span></div>
            <div class="pay-item">BAR BAR BAR <span>12,800</span></div>
        </div>

        <!-- MAIN SLOT MACHINE DISPLAY -->
        <div class="machine-frame">
            <div class="reels-window">
                <div class="reel-box" id="reel1">7️⃣</div>
                <div class="reel-box" id="reel2">7️⃣</div>
                <div class="reel-box" id="reel3">7️⃣</div>
                <div class="reel-box bonus-reel" id="reel4">10X</div>
            </div>

            <div class="status-bar" id="status-text">TAP SPIN TO WIN</div>

            <!-- LOWER CONTROL DASHBOARD -->
            <div class="control-panel">
                <div class="info-box">
                    <span class="info-label">Balance</span>
                    <span class="info-value" id="balance">100,000.00</span>
                </div>

                <div class="info-box">
                    <span class="info-label">Bet</span>
                    <span class="info-value" id="bet">960.00</span>
                </div>

                <div class="spin-btn-container">
                    <button class="spin-btn" id="spin-btn" onclick="startSpin()">SPIN</button>
                </div>

                <div class="info-box">
                    <span class="info-label">Win</span>
                    <span class="info-value" id="win-amount">0.00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // AUDIO SYNTHESIZER (No external audio files needed)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'spin') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // GAME ENGINE LOGIC
        let balance = 100000.00;
        const bet = 960.00;
        const mainSymbols = ['7️⃣', '7️⃣7️⃣', 'BAR', '🍒', '🔔'];
        const bonusSymbols = ['2X', '5X', '10X', 'RESPIN'];

        function startSpin() {
            if (balance < bet) {
                alert("Insufficient balance!");
                return;
            }

            balance -= bet;
            document.getElementById('balance').innerText = balance.toFixed(2);
            document.getElementById('win-amount').innerText = "0.00";
            document.getElementById('status-text').innerText = "SPINNING...";
            document.getElementById('status-text').style.color = "#ffd700";

            const btn = document.getElementById('spin-btn');
            btn.disabled = true;

            let spinCount = 0;
            const maxSpins = 20;

            const spinInterval = setInterval(() => {
                playSound('spin');
                document.getElementById('reel1').innerText = mainSymbols[Math.floor(Math.random() * mainSymbols.length)];
                document.getElementById('reel2').innerText = mainSymbols[Math.floor(Math.random() * mainSymbols.length)];
                document.getElementById('reel3').innerText = mainSymbols[Math.floor(Math.random() * mainSymbols.length)];
                document.getElementById('reel4').innerText = bonusSymbols[Math.floor(Math.random() * bonusSymbols.length)];

                spinCount++;

                if (spinCount >= maxSpins) {
                    clearInterval(spinInterval);
                    btn.disabled = false;
                    evaluateWin();
                }
            }, 80);
        }

        function evaluateWin() {
            const r1 = document.getElementById('reel1').innerText;
            const r2 = document.getElementById('reel2').innerText;
            const r3 = document.getElementById('reel3').innerText;
            const r4 = document.getElementById('reel4').innerText;

            let multiplier = 0;

            if (r1 === r2 && r2 === r3) {
                multiplier = 50;
            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                multiplier = 5;
            }

            if (multiplier > 0) {
                let bonusFactor = 1;
                if (r4 === '2X') bonusFactor = 2;
                if (r4 === '5X') bonusFactor = 5;
                if (r4 === '10X') bonusFactor = 10;

                const totalWin = bet * multiplier * bonusFactor;
                balance += totalWin;

                document.getElementById('balance').innerText = balance.toFixed(2);
                document.getElementById('win-amount').innerText = totalWin.toFixed(2);
                document.getElementById('status-text').innerText = `BIG WIN: ${totalWin.toFixed(2)}!`;
                document.getElementById('status-text').style.color = "#00ff66";
                playSound('win');
            } else {
                document.getElementById('status-text').innerText = "NO WIN - TRY AGAIN";
                document.getElementById('status-text').style.color = "#ff2a5f";
            }
        }
    </script>
</body>
</html>
